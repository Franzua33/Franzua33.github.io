<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversación WhatsApp - Animación Interactiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .animation-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: #f0f0f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame.active {
            opacity: 1;
        }

        .frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .controls {
            background: #fff;
            padding: 25px;
            border-top: 1px solid #e0e0e0;
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .frame-info {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .speed-control label {
            font-weight: 600;
            color: #333;
        }

        .speed-buttons {
            display: flex;
            gap: 8px;
        }

        .speed-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: #f0f0f0;
            color: #333;
        }

        .speed-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        @media (max-width: 768px) {
            .animation-container {
                height: 500px;
            }

            .control-buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .speed-control {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Conversación WhatsApp Animada</h1>
            <p>Reproducción interactiva de chat</p>
        </div>

        <div class="animation-container" id="animationContainer">
            <div class="frame active" data-frame="0">
                <img src="1771001536279_image.png" alt="Frame 1">
            </div>
            <div class="frame" data-frame="1">
                <img src="1771001545331_image.png" alt="Frame 2">
            </div>
            <div class="frame" data-frame="2">
                <img src="1771001553589_image.png" alt="Frame 3">
            </div>
            <div class="frame" data-frame="3">
                <img src="1771001582834_image.png" alt="Frame 4">
            </div>
            <div class="frame" data-frame="4">
                <img src="1771001592696_image.png" alt="Frame 5">
            </div>
            <div class="frame" data-frame="5">
                <img src="1771001605146_image.png" alt="Frame 6">
            </div>
            <div class="frame" data-frame="6">
                <img src="1771001613763_image.png" alt="Frame 7">
            </div>
            <div class="frame" data-frame="7">
                <img src="1771001629655_image.png" alt="Frame 8">
            </div>
            <div class="frame" data-frame="8">
                <img src="1771001642597_image.png" alt="Frame 9">
            </div>
            <div class="frame" data-frame="9">
                <img src="1771001656896_image.png" alt="Frame 10">
            </div>
            <div class="frame" data-frame="10">
                <img src="1771001668648_image.png" alt="Frame 11">
            </div>
        </div>

        <div class="controls">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="frame-info">
                    Frame <span id="currentFrame">1</span> de <span id="totalFrames">11</span>
                </div>
            </div>

            <div class="control-buttons">
                <button id="playBtn" onclick="togglePlay()">▶️ Reproducir</button>
                <button id="prevBtn" onclick="previousFrame()">⏮️ Anterior</button>
                <button id="nextBtn" onclick="nextFrame()">⏭️ Siguiente</button>
                <button id="restartBtn" onclick="restart()">🔄 Reiniciar</button>
            </div>

            <div class="speed-control">
                <label>⚡ Velocidad:</label>
                <div class="speed-buttons">
                    <button class="speed-btn active" onclick="setSpeed(2000)">0.5x</button>
                    <button class="speed-btn" onclick="setSpeed(1000)">1x</button>
                    <button class="speed-btn" onclick="setSpeed(500)">2x</button>
                    <button class="speed-btn" onclick="setSpeed(250)">4x</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFrame = 0;
        let totalFrames = 11;
        let isPlaying = false;
        let intervalId = null;
        let speed = 2000; // 0.5x por defecto

        function showFrame(frameIndex) {
            const frames = document.querySelectorAll('.frame');
            frames.forEach((frame, index) => {
                frame.classList.toggle('active', index === frameIndex);
            });

            currentFrame = frameIndex;
            updateUI();
        }

        function updateUI() {
            document.getElementById('currentFrame').textContent = currentFrame + 1;
            document.getElementById('totalFrames').textContent = totalFrames;
            
            const progress = ((currentFrame) / (totalFrames - 1)) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Actualizar botón de play/pause
            const playBtn = document.getElementById('playBtn');
            playBtn.textContent = isPlaying ? '⏸️ Pausar' : '▶️ Reproducir';

            // Deshabilitar botones según el frame actual
            document.getElementById('prevBtn').disabled = currentFrame === 0;
            document.getElementById('nextBtn').disabled = currentFrame === totalFrames - 1;
        }

        function nextFrame() {
            if (currentFrame < totalFrames - 1) {
                showFrame(currentFrame + 1);
            } else {
                stopPlayback();
            }
        }

        function previousFrame() {
            if (currentFrame > 0) {
                showFrame(currentFrame - 1);
            }
        }

        function togglePlay() {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            if (currentFrame === totalFrames - 1) {
                currentFrame = -1;
            }
            
            isPlaying = true;
            updateUI();
            
            intervalId = setInterval(() => {
                nextFrame();
                if (currentFrame === totalFrames - 1) {
                    stopPlayback();
                }
            }, speed);
        }

        function stopPlayback() {
            isPlaying = false;
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            updateUI();
        }

        function restart() {
            stopPlayback();
            showFrame(0);
        }

        function setSpeed(newSpeed) {
            speed = newSpeed;
            
            // Actualizar botones de velocidad
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Si está reproduciendo, reiniciar con nueva velocidad
            if (isPlaying) {
                stopPlayback();
                startPlayback();
            }
        }

        // Inicializar
        updateUI();

        // Auto-reproducir al cargar la página
        window.addEventListener('load', () => {
            startPlayback();
        });

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                    previousFrame();
                    break;
                case 'ArrowRight':
                    nextFrame();
                    break;
                case 'r':
                case 'R':
                    restart();
                    break;
            }
        });
    </script>
</body>
</html>
